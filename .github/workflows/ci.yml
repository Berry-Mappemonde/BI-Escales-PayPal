name: CI

on:
  pull_request:
    branches: [test/integration-2, main]
  push:
    branches: [test/integration-2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-copy:
    name: Release copy preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s bi-escales/scripts -p 'test_check_release_copy.py'
      - run: python bi-escales/scripts/check_release_copy.py --root .

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bi-escales/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bi-escales/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pip install mypy==2.4.1
      - run: python -m mypy --strict app/escales/paypal_sdk_gateway.py
      - run: python -m pytest tests -q -rs

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bi-escales/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bi-escales/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:test
      - run: npm run build
