# Render blueprint (optional). Core runs locally without Render.
# Enable deployment only when you set ESCALES_ENABLED on the service.
services:
  - type: web
    name: bi-escales-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: bi-escales/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ESCALES_ENABLED
        sync: false
      - key: ESCALES_ADMIN_KEY
        sync: false
      - key: ESCALES_STORE
        sync: false
      - key: MONGO_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ESCALES_WEBHOOKS_ENABLED
        sync: false
      - key: ESCALES_PUBLIC_URL
        value: https://bi-escales-api.onrender.com
      - key: ESCALES_CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://bi-escales.onrender.com
      - key: DB_NAME
        value: bi_escales
      - key: ESCALES_TOOLKIT_ENABLED
        sync: false
      - key: ESCALES_ZAPIER_ENABLED
        sync: false
      - key: HELLOASSO_MEMBERSHIP_URL
        sync: false
      # Captain IP limit and LLM daily cap are off unless this is production.
      - key: ESCALES_ENV
        value: production
      - key: ESCALES_CAPTAIN_RATE_PER_MINUTE
        value: "10"
      - key: ESCALES_CAPTAIN_RATE_PER_DAY
        value: "100"
      - key: ESCALES_LLM_DAILY_CAP
        value: "100"
  # Site statique du mini-mix. Auto-deploy off: ne pas lancer ce service depuis cette PR.
  # VITE_API_BASE est lu au build. CORS de l'API autorise déjà https://bi-escales.onrender.com.
  - type: web
    name: bi-escales
    runtime: static
    rootDir: bi-escales/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE
        value: https://bi-escales-api.onrender.com
      - key: VITE_ENABLE_AG_GRID
        value: "0"
